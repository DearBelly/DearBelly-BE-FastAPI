services:
  prometheus:
    user: ${PROMETHEUS_USER}
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - /home/ubuntu/dearbelly/deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/ubuntu/prometheus/volume:/prometheus/data
    ports:
      - 9090:9090
    command:
      - '--web.enable-lifecycle'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: always
    networks:
      - mynetwork

  grafana:
    user: ${GRAFANA_USER}
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - /home/ubuntu/grafana/volume:/var/lib/grafana
    restart: always
    networks:
      - mynetwork

  dcgm-exporter:
      image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
      container_name: dcgm-exporter
      ports:
        - "9400:9400"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]
      environment:
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=utility,compute
      restart: unless-stopped
      networks:
        - mynetwork
      healthcheck:
        test: [ "CMD", "wget", "-qO-", "http://localhost:9400/metrics" ]
        interval: 30s
        timeout: 5s
        retries: 5

networks:
  mynetwork:
    driver: bridge