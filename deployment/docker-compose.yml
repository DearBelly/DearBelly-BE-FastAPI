services:
  app-blue:
    image: ${ECR_URI}/dearbelly-cv:latest
    ports:
      - "8000:8000"
    env_file:
      - /home/ubuntu/dearbelly/deployment/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    container_name: app-blue
    networks:
      - mynetwork

  app-green:
    image: ${ECR_URI}/dearbelly-cv:latest
    ports:
      - "8001:8000"
    env_file:
      - /home/ubuntu/dearbelly/deployment/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    container_name: app-green
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge